name: COBOL Check Automation

on:
  push:
     branches: [ main ]

jobs:
  cobol-check:
    runs-on: ubuntu-latest

    steps:
    - uses: actions/checkout@v2
    - name: Set up Java
      uses: actions/setup-java@v5
      with:
        distribution: 'microsoft'
        java-version: '11'
    - name: Setup Node.js
      uses: actions/setup-node@v4
      with:
        node-version: '20'
    - name: Install ZOWE CLI
      run: npm install -g @zowe/cli
    - name: Verify ZOWE
      run: zowe --version
    - name: Build ZOWE profile
      run: |
        zowe profile create zosmf myprofile \
          --host ${{ secrets.ZOWE_HOST }} \
          --port ${{ secrets.ZOWE_PORT }} \
          --user ${{ secrets.ZOWE_USERNAME }} \
          --password ${{ secrets.ZOWE_PASSWORD }} \
          --reject-authorized false
    - name: Setup Mainframe Environment and Upload COBOL Check
      run: |
        chmod +x .github/scripts/zowe_operations.sh
        .github/scripts/zowe_operations.sh
    - name: Run COBOL Check on Mainframe
      run: |
        chmod +x .github/scripts/mainframe_operations.sh
        .github/scripts/mainframe_operations.sh
